
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#252535">
<link rel="manifest" href="manifest.json">
<title>My Smart Calculator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;
  font-family:Arial,sans-serif;
  background:#171725;color:white;
}
.container{max-width:450px;margin:auto}
h1{text-align:center;color:#8e9cff}
.tabs{display:flex;gap:6px;margin:20px 0}
.tabs button{
  flex:1;padding:12px 5px;border:0;border-radius:10px;
  background:#34344b;color:white;font-weight:bold;
}
.tabs button.active{background:#6979ff}
.panel{
  display:none;background:#252535;padding:16px;
  border-radius:16px;
}
.panel.active{display:block}
#display{
  width:100%;height:65px;font-size:27px;text-align:right;
  padding:12px;border:0;border-radius:10px;
  background:#11111c;color:white;margin-bottom:12px;
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{
  padding:17px 5px;border:0;border-radius:10px;
  background:#3a3a52;color:white;font-size:18px;
}
.keys button.operator{background:#5868d9}
.keys button.equal{background:#20a879}
.keys button.clear{background:#d34e64}
input,select{
  width:100%;padding:13px;margin:9px 0;
  border:0;border-radius:9px;font-size:17px;
}
.action{
  width:100%;padding:14px;border:0;border-radius:10px;
  background:#6979ff;color:white;font-size:17px;
  font-weight:bold;margin-top:10px;
}
.result{
  background:#171725;padding:15px;border-radius:10px;
  margin-top:15px;font-size:18px;line-height:1.7;
}
.small{text-align:center;color:#aaa;font-size:13px}
</style>
</head>

<body>
<div class="container">
<h1>🧮 My Smart Calculator</h1>

<div class="tabs">
<button class="active" onclick="showTab('scientific',this)">Scientific</button>
<button onclick="showTab('gst',this)">GST</button>
<button onclick="showTab('discount',this)">Discount</button>
</div>

<section id="scientific" class="panel active">
<h2>Scientific Calculator</h2>
<input id="display" type="text" placeholder="0" readonly>

<div class="keys">
<button onclick="add('sin(')">sin</button>
<button onclick="add('cos(')">cos</button>
<button onclick="add('tan(')">tan</button>
<button onclick="add('sqrt(')">√</button>

<button onclick="add('log(')">log</button>
<button onclick="add('ln(')">ln</button>
<button onclick="add('pi')">π</button>
<button onclick="add('e')">e</button>

<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>
<button onclick="add('^')">xʸ</button>
<button onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="clear" onclick="clearDisplay()">C</button>
<button class="equal" onclick="calculate()">=</button>
</div>

<button class="action" onclick="toggleAngle()">Angle: <span id="angle">DEG</span></button>
<p class="small">Use sin, cos, tan, square root, log and powers.</p>
</section>

<section id="gst" class="panel">
<h2>GST Calculator</h2>
<label>Enter price (₹)</label>
<input id="price" type="number" min="0" placeholder="Enter amount">

<label>Select GST rate</label>
<select id="gstRate">
<option value="5">5%</option>
<option value="12">12%</option>
<option value="18" selected>18%</option>
<option value="28">28%</option>
</select>

<button class="action" onclick="calculateGST()">Calculate GST</button>
<div id="gstResult" class="result">Your result will appear here.</div>
</section>

<section id="discount" class="panel">
<h2>Discount Calculator</h2>
<label>Original price (₹)</label>
<input id="original" type="number" min="0" placeholder="Enter price">

<label>Discount (%)</label>
<input id="discountRate" type="number" min="0" max="100" placeholder="Enter discount">

<button class="action" onclick="calculateDiscount()">Calculate Discount</button>
<div id="discountResult" class="result">Your result will appear here.</div>
</section>

<p class="small">Made with ❤️ using HTML, CSS and JavaScript</p>
</div>

<script>
let isDegree = true;

function showTab(id,button){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  button.classList.add('active');
}

function add(value){
  document.getElementById('display').value += value;
}

function clearDisplay(){
  document.getElementById('display').value = '';
}

function toggleAngle(){
  isDegree = !isDegree;
  document.getElementById('angle').textContent = isDegree ? 'DEG' : 'RAD';
}

function calculate(){
  const display = document.getElementById('display');
  let expression = display.value;

  try{
    if(!expression) return;

    expression = expression
      .replace(/π/g,'pi')
      .replace(/\^/g,'**')
      .replace(/pi/g,'Math.PI')
      .replace(/\be\b/g,'Math.E');

    const allowed = /^[0-9+\-*/().\sA-Za-z]*$/;
    if(!allowed.test(expression)) throw new Error('Invalid');

    const names = expression.match(/[A-Za-z]+/g) || [];
    const permitted = ['Math','PI','E','sin','cos','tan','sqrt','log','ln'];

    if(names.some(name=>!permitted.includes(name))){
      throw new Error('Invalid');
    }

    expression = expression
      .replace(/\bsin\(/g,'functions.sin(')
      .replace(/\bcos\(/g,'functions.cos(')
      .replace(/\btan\(/g,'functions.tan(')
      .replace(/\bsqrt\(/g,'Math.sqrt(')
      .replace(/\blog\(/g,'Math.log10(')
      .replace(/\bln\(/g,'Math.log(');

    const functions = {
      sin:x=>Math.sin(isDegree?x*Math.PI/180:x),
      cos:x=>Math.cos(isDegree?x*Math.PI/180:x),
      tan:x=>Math.tan(isDegree?x*Math.PI/180:x)
    };

    const result = Function('functions','return ('+expression+')')(functions);

    if(!Number.isFinite(result)) throw new Error('Invalid');
    display.value = Number(result.toFixed(10)).toString();
  }catch(error){
    display.value = 'Error';
  }
}

function calculateGST(){
  const price = Number(document.getElementById('price').value);
  const rate = Number(document.getElementById('gstRate').value);
  const result = document.getElementById('gstResult');

  if(!Number.isFinite(price) || price<=0){
    result.textContent='Please enter a valid price.';
    return;
  }

  const gst = price*rate/100;
  const total = price+gst;

  result.innerHTML =
    'Original Price: ₹'+price.toFixed(2)+'<br>'+
    'GST Amount: ₹'+gst.toFixed(2)+'<br>'+
    'Total Price: ₹'+total.toFixed(2);
}

function calculateDiscount(){
  const price = Number(document.getElementById('original').value);
  const rate = Number(document.getElementById('discountRate').value);
  const result = document.getElementById('discountResult');

  if(!Number.isFinite(price) || price<=0 ||
     !Number.isFinite(rate) || rate<0 || rate>100){
    result.textContent='Enter a valid price and discount (0–100%).';
    return;
  }

  const saved = price*rate/100;
  const finalPrice = price-saved;

  result.innerHTML =
    'Original Price: ₹'+price.toFixed(2)+'<br>'+
    'You Save: ₹'+saved.toFixed(2)+'<br>'+
    'Final Price: ₹'+finalPrice.toFixed(2);
}
</script>
</body>
</html>
